<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="4 4 120 120" role="img" aria-labelledby="title desc">
<title id="title">USTC IonQNet — 梅花刀片阱</title><desc id="desc">Original group emblem inspired by USTC heritage. Four tapered blade electrodes with rounded inward-facing tips and square rear edges surround a horizontal five-ion register. Two cyan mirror substrates with pronounced circular concave faces, flat backs and softened corners lie symmetrically on the perpendicular vertical axis. A single cyan output line is aligned above the upper mirror, separated from its back by a small visual gap. Conceptual brand geometry, not to scale.</desc>
